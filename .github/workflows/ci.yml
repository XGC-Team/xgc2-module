name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload:
        description: "'false' builds and checks everything but publishes no artifact (release compatibility verification)"
        type: string
        default: "true"
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: cargo test (${{ matrix.distribution }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The XGC2 build image of each release brings the Rust toolchain and that release's compilers,
        # so the test modules and the SDK are checked with the oldest and the newest compilers.
        distribution: [focal, noble]
    steps:
      - uses: actions/checkout@v4
      - name: Documentation, unit and integration tests (the integration tests compile the C and C++ test modules in tests/modules) and the SDK as a module author consumes it
        run: .xgc2/scripts/ci_test.sh --distribution "${{ matrix.distribution }}"
  build-host:
    name: Host binary in the Ubuntu 18.04 image (${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build against glibc 2.27 so one binary serves bionic, focal and noble
        run: .xgc2/scripts/ci_build_host.sh --output "$RUNNER_TEMP/host"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-module-host-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/host/xgc2-module-host
          retention-days: 14
  packages:
    name: Packages ${{ matrix.distribution }} (${{ matrix.arch }})
    needs: [test, build-host]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distribution: [bionic, focal, noble]
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xgc2-module-host-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/host
      - name: Build both packages, install them in the XGC2 build image of the release and check them
        run: |
          chmod +x "$RUNNER_TEMP/host/xgc2-module-host"
          .xgc2/scripts/ci_package.sh --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --binary "$RUNNER_TEMP/host/xgc2-module-host" --output debs
      - name: Create strict source-bound build manifest
        run: |
          version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product xgc2-module --product-version "$version" \
            --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload != 'false' }}
        with:
          name: xgc2-module-debs-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
