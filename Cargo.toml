[workspace]
resolver = "3"
members = ["crates/xgc2-module-host"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/XGC-Team/xgc2-module"

[workspace.dependencies]
# Control plane: XRPC http.v1 over a Unix socket. The host uses Runtime/RuntimeOptions,
# Host::bind, handler, Context (query/deadline/blocking), Fault, Limits, Method and new_instance_id
# (plus BlockingClient in tests).
xgc2-xrpc = { git = "https://github.com/XGC-Team/xgc2-xrpc", rev = "ec2953aac4d588e9ff139f1e6a498d04afa8187f" }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["sync", "time"] }
tempfile = "3"

[profile.release]
debug = 1

# Module loading hashes every library; unoptimized sha2 takes about a second per
# debug-built module and slows the integration tests.
[profile.dev.package.sha2]
opt-level = 3
