schema: xgc2.product.v1
id: xgc2-module
name: XGC2 Module
version: 0.2.0-1
kind: toolchain-apt
summary: Same-entity module aggregation - the module ABI SDK for module authors and the xgc2-module-host process that runs the modules of one entity.
apt:
  distribution: bionic,focal,noble
  install:
  - libxgc2-module-dev
  - xgc2-module-host
  packages:
  - libxgc2-module-dev
  - xgc2-module-host
  package_architectures:
    libxgc2-module-dev:
    - amd64
    - arm64
    xgc2-module-host:
    - amd64
    - arm64
  depends: []
usage:
  install: sudo apt install libxgc2-module-dev xgc2-module-host
  smoke_test: xgc2-module-host --manifest /usr/share/doc/xgc2-module-host/examples/entity.toml --check; test -f /usr/include/xgc2/module.h
  notes: >-
    libxgc2-module-dev is header-only (architecture all): <xgc2/module.h> and the Xgc2Module CMake
    package with the imported target Xgc2Module::SDK; module authors use find_package(Xgc2Module
    CONFIG REQUIRED). xgc2-module-host is one binary built against glibc 2.27, so the same build
    serves Ubuntu 18.04, 20.04 and 24.04. Products ship their own modules (shared libraries that
    export xgc2_module_entry) and their own entity manifests; this product contains no domain logic.
    One host process runs one entity; the control plane is XRPC http.v1 on a Unix socket named in
    the manifest or by --control-socket.
ownership:
  paths:
  - /usr/include/xgc2/module.h
  - /usr/share/cmake/Xgc2Module
  - /usr/bin/xgc2-module-host
  - /usr/share/doc/xgc2-module-host
release:
  repository: XGC-Team/xgc2-sync-runtime
  ref: main
  ci_workflow: ci.yml
  workflow: release.yml
  apt_versions:
    bionic: 0.2.0-1~bionic
    focal: 0.2.0-1~focal
    noble: 0.2.0-1~noble
